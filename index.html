<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Product Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Product Dashboard</h1>
        <p>Browse products from a REST API</p>
    </header>

    <main>

        <section aria-labelledby="controls-title">
            <h2 id="controls-title">Product Controls</h2>

            <label for="search-input">Search products</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search by product name..."
            >

            <label for="category-filter">Category</label>
            <select id="category-filter">
                <option value="all">All Categories</option>
            </select>

            <label for="sort-select">Sort by</label>
            <select id="sort-select">
                <option value="default">Default</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </section>

        <section aria-labelledby="products-title">

            <h2 id="products-title">Products</h2>

            <div id="loading" class="loading-skeleton" aria-live="polite">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
</div>

             <div id="error-message" role="alert" hidden>
    <p>Unable to load products.</p>
    <button type="button" id="retry-button">Retry</button>
</div>

            <div
                id="product-list"
                aria-live="polite"
            ></div>

        </section>

    </main>

    <script type="module" src="app.js"></script>

</body>
</html>
